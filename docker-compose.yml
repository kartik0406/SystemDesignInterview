version: '3.9'

services:
  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sdi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot API Gateway ───────────────────────────────
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: sdi-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      DATABASE_URL: ${DATABASE_URL:-jdbc:postgresql://postgres:5432/sdi_db}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-sdi_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-sdi_pass}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_SERVICE_URL: http://llm-service:8000
    depends_on:
      redis:
        condition: service_healthy
      llm-service:
        condition: service_started

  # ─── Python LLM Service ───────────────────────────────────
  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: sdi-llm-service
    ports:
      - "8000:8000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX_NAME: ${PINECONE_INDEX_NAME:-sdi-knowledge}
    volumes:
      - ./knowledge-base:/app/data/knowledge
    depends_on:
      redis:
        condition: service_healthy

  # ─── React Frontend ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdi-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - api-gateway
